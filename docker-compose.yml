version: "3.8"

services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    # Sem "ports": o MySQL fica acessível apenas pela rede interna do Compose
    networks:
      - backend

  wordpress1:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    depends_on:
      - db
    environment: &wp_env
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wordpress:/var/www/html
    # Sem "ports": só o Nginx consegue acessá-lo
    networks:
      - backend

  wordpress2:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    depends_on:
      - db
      - wordpress1
    environment: *wp_env
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - backend

  wordpress3:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    depends_on:
      - db
      - wordpress1
    environment: *wp_env
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - backend

  nginx:
    image: nginx:1.19.0
    restart: always
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./wordpress:/usr/share/nginx/html
    networks:
      - backend

volumes:
  db_data:

networks:
  backend: